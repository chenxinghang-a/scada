name: SCADA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 为什么跑 windows-latest 而不是 ubuntu-latest
    # ---------------------------------------------------------------
    # 这个产品的交付物是 **Windows 桌面应用**（PyInstaller 打后端 exe +
    # Electron 打包安装程序）。在 ubuntu 上跑测试，等于**从来没有验证过
    # 目标平台**：路径分隔符、`os.name == 'nt'` 分支、Windows 文件锁语义
    # （SQLite 的 `-wal` / `-shm`）、大小写不敏感的文件系统，
    # 以及 pywin32 这类平台专属依赖，只有在这里才真正被执行到。
    #
    # 只跑 Python 3.13：这是实际开发与打包使用的版本。
    # 保留 3.12 矩阵的收益（多一个次要版本兼容性信号）远小于
    # Windows runner 翻倍的成本，而"目标平台正确"优先级更高。
    runs-on: windows-latest
    env:
      # ── 根因修复：Windows runner 的编码环境不是 UTF-8 ──────────────────
      # 本项目的目录名（采集层/报警层/存储层/展示层/用户层/智能层）、日志、
      # 配置内容全是中文。GitHub 的 Windows runner 默认使用系统 ANSI 代码页
      # （cp1252），于是：
      #   - `print()` / logging 到控制台的中文 → UnicodeEncodeError
      #   - `open()` / `Path.read_text()` 未显式指定 encoding 时按 cp1252 解码
      #     → 读中文文件 UnicodeDecodeError
      #   - subprocess text 模式同理
      # 表现就是「本机全绿、CI 全红」，而且报错信息本身也可能编不出来。
      #
      # 实测证据：把 annotation 诊断脚本在 PYTHONIOENCODING=cp1252 下运行，
      # 立刻在 print 中文标题处抛 UnicodeEncodeError，与 CI 上该步骤失败一致。
      #
      # PYTHONUTF8=1 开启 Python 的 UTF-8 模式：stdio、文件系统编码、
      # open() 默认编码全部走 UTF-8，一次解决上面三类问题。
      # PYTHONIOENCODING 再加一道保险（某些三方库会自己看这个变量）。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite
        # shell 用 bash：Windows runner 自带 Git Bash，`set -o pipefail` 才能让
        # pytest 的非零退出码穿过 `tee` 传出去（否则管道会吞掉失败，CI 假绿）。
        shell: bash
        # --cov 不传值：源码范围读 pyproject.toml 的 [tool.coverage.run].source
        # （显式列出源码包，排除 dist/ 里那份约 248 MB 的重复源码 ——
        # 旧写法 `--cov=.` 会把整份 PyInstaller 产物统计进去，既慢又严重失真）。
        #
        # --cov-fail-under=45：本地实测 46.72%，留余量避免跨平台抖动造成假红，
        # 同时足以拦住"覆盖率明显倒退"。
        # 待补的短板模块：real_device_manager(22%) / modbus_client(43%) /
        # opcua_client(60%)。
        run: |
          set -o pipefail
          pytest tests/ -q --cov --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=45 2>&1 | tee pytest.log

      - name: Publish failure detail as annotation
        # 失败时把 pytest 输出末尾若干行发成 annotation。
        #
        # 为什么要走 annotation 而不是 step summary / job log：
        #   - 下载 job log 需要仓库管理员权限（只读访问 403）
        #   - `$GITHUB_STEP_SUMMARY` 不会出现在 check-runs API 的
        #     `output.summary` 字段里，脚本读不到
        #   - artifact 下载同样需要认证
        # 只有 annotation 是公开可读的：
        #   GET /repos/{owner}/{repo}/check-runs/{id}/annotations
        # 这样"CI 为什么红"在远端也能查到，而不是只有一句 exit code 1。
        if: failure()
        run: python .github/scripts/emit_failure_annotation.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: warn

  lint:
    # lint 与平台无关，放 ubuntu 跑得更快、更省额度。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install ruff

      - name: Ruff (advisory, non-blocking)
        # 有意保持非阻断：历史代码存在大量可自动修的风格问题，
        # 一次性开成阻断会淹没真正有价值的信号。先当趋势看。
        continue-on-error: true
        run: ruff check . --select E,W,F --ignore E501,W503

  build-backend:
    # 在 clean checkout 上证明后端可打包，产出 dist/scada-backend/（onedir）。
    #
    # 为什么用 scada-backend.spec 而不是 SCADA.spec / build.py：
    #   - SCADA.spec 的 datas 硬编码了 'C:\Users\cxx\...\industrial_scada'，
    #     换机 / CI runner 上直接失效；
    #   - build.py 走的是 launcher.py onefile（SCADA.exe），面向"双击即用"，
    #     而前端 Electron 的 extraResources 期望的是 onedir 布局
    #     （scada-backend.exe + _internal/，见 scada-app/electron/main.js）；
    #   - scada-backend.spec 用 os.path.abspath(SPECPATH) 定位仓库根，可移植，
    #     入口 run.py、onedir 输出 dist/scada-backend/，与前端需求完全对齐。
    runs-on: windows-latest
    env:
      # 与 test job 同理：datas 目标全是中文目录名（采集层/报警层/...），
      # runner 默认 ANSI 代码页下打包会因编码问题失败，必须开 UTF-8 模式。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build backend (PyInstaller onedir)
        run: python -m PyInstaller scada-backend.spec --noconfirm --clean

      - name: Verify entry exe exists
        shell: bash
        run: test -f dist/scada-backend/scada-backend.exe

      - name: Clean-checkout verification
        # 本 job 本身就是 clean checkout 验证：runner 上只有 git 跟踪的文件，
        # 构建成功即证明不依赖开发机上未跟踪的隐藏文件。
        # 再显式断言构建后工作区无新增未跟踪文件（dist/ build/ 已被 .gitignore
        # 覆盖），若有输出说明 spec/构建过程读了或写了仓库外的内容。
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: dist/scada-backend/
          retention-days: 14
