  - id: SF-07
    name: 设备删除/覆盖失败必须回滚（不得丢失旧配置）
    standard: [GB/T 21109]
    code: 采集层/real_device_manager.py::remove_device
    tests: [tests/test_real_manager_reload_edges_round408.py, tests/test_manager_rollback_parity.py]
    status: verified
    note: "本轮补 tests/test_manager_rollback_parity.py：同一组断言（新增/覆盖/删除
           × 落盘失败）对三份实现各跑一遍，共 15 条，把「一致」变成可执行约束。
           修掉三处真实差异：(1) device_manager.remove_device 不还原 clients
           → 设备在表里但没连接，采集永远拿不到数据；(2) simulated.add_device
           算了 previous 却没用，覆盖失败时旧配置直接丢失；(3) 删不存在的设备
           real 返回 False、另两份返回 True（两份既有用例都断言 True），统一为幂等。
           另修 device_manager 删空设备仍落盘的无谓写。
           关于 _raw_devices：它在 add_device 里是落盘成功之后才更新的，删除路径
           不碰它，且 _save_config 按内存表遍历还原占位符 —— 删掉的设备不会被
           写回，因此**不需要回滚**（已在测试注释里写明，避免后来人误加断言）。"

  - id: SF-08
    name: 退出时未入库数据必须落盘，下次启动可恢复
    standard: [GB/T 21109]
    code: 采集层/data_collector.py::stop
    tests: [tests/test_shutdown_data_preservation.py]
    status: verified
    note: "覆盖\"处理线程未退出\"分支；断电（非优雅退出）依赖 SQLite WAL，未做掉电注入验证。"

  - id: SF-09
    name: 协议短帧/坏帧不得被当作有效数据
    standard: [GB/T 21109]
    code: 采集层/data_collector.py::_collect_device_data_inner
    tests: [tests/test_mc_client.py, tests/test_sibling_paths_parity.py, tests/test_short_frame_not_faked.py]
    status: partial
    note: |
      本轮补齐了「短帧」这一半 —— 六个用例，覆盖两条**独立实现**的读路径：
      · 单次读取（<=125 个寄存器）：少给一个 → 该寄存器不产生记录、
        计 dropped_register_short；
      · 分块读取（>125）：块内短缺同样丢弃，且 125+5 两块分开验证。
      重点断言的是「不许补 0」：短帧寄存器**不存在**于结果里，
      而不是存在一条 value=0 的记录；float32 只回半个字也必须整条丢
      （否则会解出一个完全错误的小数）。
      已做变异验证：把 `continue` 改成 `raw + [0]*(size-len(raw))`，
      4 条用例精确变红，恢复后全绿。
      仍然 partial 的部分：「坏帧」的传输层形态（CRC 错、超长帧、
      粘包/拆包）需要真实 PLC/网关的抓包样本 —— 那部分造不出来，
      没有样本就只能假定客户端库正确。


  - id: SF-10
    name: 断线期间数据质量降级而不是"沿用上次值当正常值"
    standard: [GB/T 21109]
    code: 采集层/modbus_client.py::_fallback_to_cache
    tests: [tests/test_modbus_stale_data.py, tests/test_realtime_quality_persistence.py, tests/test_data_collector.py]
    status: verified
    note: |
      降级有两条路径，都已验证：
      (1) Modbus 读失败 → 客户端用缓存兜底 → 采集层 _mark_stale 打 stale 标记
          + 用缓存原始时刻做时间戳 → assess() 在 quality==GOOD 时降为
          UNCERTAIN_LAST_USABLE(64)。覆盖见 test_modbus_stale_data.py 的
          test_collect_modbus_flags_stale_item 与 test_realtime_quality_persistence.py。
      (2) 设备 status 为 offline/disconnected → assess() 直接返回
          BAD_COMM_FAILURE(6)，且这条判定在 stale 之前，不会被"升级"成 UNCERTAIN
          （代码有显式注释）。OPC UA / REST / MQTT 没有 last_read_source，靠的正是这条。
      端到端实测（本轮手工，可复现）：POST /api/devices/vibration_sensor_01/disconnect
      后连续观察 22 秒 —— bearing_temperature 的 timestamp 冻在断开那一刻、
      value 不变、quality 仍是断开前的 192。也就是说断线后不再产生新记录，
      而不是"拿旧值配新时间戳入库"；前端卡片同时切到「离线」
      （deviceStateInfo 的 connected=false 分支）。
      剩余风险：真实 PLC 的「半开连接」（TCP 仍通、设备不响应）未验证 ——
      那种情况下 read 会阻塞到超时，行为取决于现场超时配置，需上真机。


