# 安全相关功能追溯表（骨架，需与需求文档/危害分析对齐后签署）
#
# 字段说明：
#   id        追溯编号（与需求/HAZOP 条目关联）
#   name      功能描述（面向审核员，不写实现术语）
#   standard  适用标准族（仅列可能适用的，**适用性必须由安全评估机构确认**）
#   code      实现位置 `相对路径::可检索符号`
#   tests     验证用例（文件或 文件::函数）
#   status    verified=有可复现验证；partial=仅模拟/部分路径；gap=无验证
#   note      差距说明（审核时必须如实呈现，不能隐藏）
#
# 维护规则：新增安全相关功能必须同时加 code 与 tests，否则 `check_traceability.py` 失败。

meta:
  owner: 待指定（安全负责人）
  last_review: 2026-11-11
  standards_reference:
    - GB/T 20438（等同 IEC 61508，功能安全）
    - GB/T 21109（等同 IEC 61511，过程工业 SIS）
    - GB/T 30976（工业控制系统信息安全）
    - GB/T 22239（网络安全等级保护基本要求）

functions:
  - id: SF-01
    name: 急停（E-STOP）时机械类点位强制归零
    standard: [GB/T 21109]
    code: 采集层/simulated_client.py::_estop_override
    tests: [tests/test_silent_failures_round307.py, tests/test_estop_machinery_scope.py]
    status: verified
    note: |
      责任边界先划清（详见 `文档/安全边界声明.md` §2）：
      硬急停回路、SIS、保护逻辑由 PLC/SIS 独立完成，不依赖本系统；
      本系统保证的是**软件侧**行为 —— 急停激活后把「机械类点位」归零。
      SF-01 断言的就是这个软件侧行为，硬件侧不在本系统的验证范围内。

      本轮补 `tests/test_estop_machinery_scope.py`（20 条）：
      归零行为（激活归零/工艺量不变/解除恢复/冻结表清空/幂等）
      + 机械类判定的正反边界。此前 `_estop_override` 与 `_is_machinery`
      在整个 tests/ 里零引用，这条路径从没被验证过。

      顺带修掉一个真实缺陷：`_is_machinery` 的注释声称用词边界避免了
      「position 匹配 temperature_position」，但 `(?<![a-z])` 只排除小写字母、
      `_` 不是字母 —— 防护根本不存在。实测 `temperature_position`、`flow_speed`
      都被判为机械类，急停时会归零，操作员会把"停机"看成"温度/流量掉零"。
      已加工艺量排除层修复。

      分层说明：`device_control.emergency_stop` 筛设备用的是
      `IDeviceManager.get_device_category()`（**设备级**分类）；
      `_is_machinery` 是**寄存器级**判定。两者独立，本条目覆盖后者。


  - id: SF-02
    name: 停机设备不产生"正常"读数（质量码降级）
    standard: [GB/T 21109]
    code: 采集层/simulated_client.py::device_stopped
    tests: ["tests/test_simulation_profiles*.py", tests/test_realtime_quality_persistence.py, tests/test_data_collector.py]
    status: partial
    note: |
      本轮把口径**显式化**了：`文档/质量码口径.md` 一张表写清
      「代码里怎么判 / 库里怎么存 / 前端怎么画」，包括判定优先级与三个
      定义了但从不产生的码（104/80/8）。
      代码层面已确认的核心：设备 status 为 offline/disconnected 时，
      `assess()` 的第一条分支就返回 BAD_COMM_FAILURE(6)，不会因为
      "值看起来很合理"而给 GOOD；采集层的 stale 降级只在 `quality == GOOD`
      时生效，不会把已判 BAD 的值"升级"成 UNCERTAIN。
      仍然 partial 的原因不是代码，而是**口径需要外部确认**，四条见文档 §5：
      ①「不确定」是否要拆成通信类/设备类；② 5 分钟卡死窗口与千分之一阈值
      是否适配现场采样周期与量程；③ BAD 是否要参与报警；
      ④ 入库时"缺 quality 默认 GOOD"（乐观默认，与其它地方的 fail-closed 相反）
      是否还有调用方依赖。


  - id: SF-03
    name: 控制写入必须"写后回读"且不一致即判失败
    standard: [GB/T 21109]
    code: 智能层/device_control.py::write_with_verification
    tests: [tests/test_write_safety.py, tests/test_write_endpoint_safety.py]
    status: verified
    note: "模拟设备回读；真实设备回读逻辑需现场确认字节序与量纲。"

  - id: SF-04
    name: 未授权/越权用户不得执行控制写入
    standard: [GB/T 30976, GB/T 22239]
    code: 用户层/auth.py::role_required
    tests: [tests/test_security_penetration.py, tests/test_authz_matrix.py]
    status: verified
    note: "本轮补 tests/test_authz_matrix.py：12 个代表端点 × 4 角色穷举，59 条用例，
           并有一条 viewer 写操作兜底清单。所有探测请求都指向不存在的资源
           （__authz_probe__）或空 payload，鉴权失效也不会产生副作用。
           已做变异验证（把 viewer 混进 /api/auth/users 的允许名单，精确红在该格）。
           范围限于 API 层与本系统的页面级 _PAGE_ROLES；真实 PLC/DCS 侧的操作权限
           由现场系统自身保证，不在本系统断言范围内。"

  - id: SF-05
