# 安全相关功能追溯表（骨架，需与需求文档/危害分析对齐后签署）
#
# 字段说明：
#   id        追溯编号（与需求/HAZOP 条目关联）
#   name      功能描述（面向审核员，不写实现术语）
#   standard  适用标准族（仅列可能适用的，**适用性必须由安全评估机构确认**）
#   code      实现位置 `相对路径::可检索符号`
#   tests     验证用例（文件或 文件::函数）
#   status    verified=有可复现验证；partial=仅模拟/部分路径；gap=无验证
#   note      差距说明（审核时必须如实呈现，不能隐藏）
#
# 维护规则：新增安全相关功能必须同时加 code 与 tests，否则 `check_traceability.py` 失败。

meta:
  owner: 待指定（安全负责人）
  last_review: 2026-11-11
  standards_reference:
    - GB/T 20438（等同 IEC 61508，功能安全）
    - GB/T 21109（等同 IEC 61511，过程工业 SIS）
    - GB/T 30976（工业控制系统信息安全）
    - GB/T 22239（网络安全等级保护基本要求）

functions:
