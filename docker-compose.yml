version: "3.8"

services:
  # ========== SCADA 主应用 ==========
  scada:
    build: .
    container_name: scada-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # 注意：没有 SCADA_MODE —— 运行模式由 run.py 的命令行开关决定
      # （无参=模拟 / --simulator / --real），环境变量从未被读（round 206 删除）。
      #
      # SCADA_ENV=production：容器部署即生产。它会让 config.py 在密钥缺失/为弱默认值时
      # **拒绝启动**（fail-closed），而不是悄悄生成一个重启就失效的随机密钥。
      - SCADA_ENV=production
      - SCADA_HOST=0.0.0.0
      - SCADA_PORT=5000
      # round 326：钉死时区。不设时容器是 UTC，而代码用 datetime.now()（本地）
      # + SQLite CURRENT_TIMESTAMP（UTC），同一行时间字段会差 8 小时。
      - TZ=Asia/Shanghai
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - TDENGINE_HOST=tdengine
      - TDENGINE_PORT=6041
      # 密钥必须由部署者显式注入。`:?` 语法让 `docker compose up` 在未设置时**直接报错**，
      # 而不是回退到 `change-me-in-production` 这种公开弱值（等于没有密钥）。
      # 生成方式：python -c "import secrets;print(secrets.token_hex(32))"
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 未设置：请在 .env 或部署环境中提供强随机值}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 未设置：请在 .env 或部署环境中提供强随机值}
    volumes:
      - scada-data:/app/data
      - scada-logs:/app/logs
    depends_on:
      emqx:
        condition: service_healthy
      tdengine:
        condition: service_healthy
    networks:
      - scada-net

  # ========== EMQX MQTT Broker ==========
  emqx:
    image: emqx/emqx:5.6.1
    container_name: scada-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # WebSocket
      - "18083:18083"  # Dashboard
    environment:
      - EMQX_NAME=scada
      - EMQX_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - scada-net

  # ========== TDengine 时序数据库 ==========
  tdengine:
    image: tdengine/tdengine:3.3.2.0
    container_name: scada-tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"    # native
      - "6041:6041"    # REST
      - "6043:6043"    # taosAdapter
    environment:
      - TAOS_FQDN=tdengine
    healthcheck:
      test: ["CMD", "taos", "-s", "SELECT server_version()"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
    networks:
      - scada-net

  # ========== nginx 反向代理 ==========
  nginx:
    image: nginx:1.25-alpine
    container_name: scada-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scada
    networks:
      - scada-net

  # ========== Grafana 可视化 ==========
  grafana:
    image: grafana/grafana:10.4.2
    container_name: scada-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      # 不再写死 admin123（公开弱口令）。必须由部署者显式注入。
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD 未设置：请提供强口令}
      - GF_INSTALL_PLUGINS=tdengine-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tdengine
    networks:
      - scada-net

volumes:
  scada-data:
  scada-logs:
  emqx-data:
  emqx-log:
  tdengine-data:
  tdengine-log:
  grafana-data:

networks:
  scada-net:
    driver: bridge
