[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-scada"
# 版本号唯一真源：项目根目录的 VERSION 文件。不要在此硬编码版本。
# 构建时由 setuptools 动态读取，运行时由 core.version 读取，前后端 lockstep。
dynamic = ["version"]
description = "Industrial SCADA System - Modbus/OPC-UA/MQTT protocol gateway with real-time monitoring"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "pymodbus>=3.6.0",
    "asyncua>=1.0.0",
    "paho-mqtt>=1.6.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1",
]
tdengine = [
    "taos>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["配置*", "模板*", "静态资源*"]

[tool.setuptools.dynamic]
# 版本号从根目录 VERSION 文件读取（唯一真源）。
version = {file = "VERSION"}

[tool.pytest.ini_options]
# 真正的测试套件在 tests/（约 1880 个用例）。
# 历史配置指向 测试/，那里只有 13 个 2026-05 的遗留脚本，其中 4 个直接 ERROR、
# 其余用 `return True` 而非 assert（pytest 会警告 PytestReturnNotNone），
# 等于永远不会失败。结果就是裸跑 `pytest` 得到"13 个全绿"的假信号。
# 遗留目录待清理，先用 norecursedirs 排除，避免误收集。
testpaths = ["tests"]
norecursedirs = ["测试", "dist", "build", ".venv", "node_modules", "managed_components"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
# 显式列出源码包。不写 `source = ["."]` 是因为仓库根下还有：
#   dist/       —— PyInstaller 产物，内含**整份重复源码**（约 248 MB），
#                  统计进去既极慢又严重失真
#   legacy/     —— 已归档的游离脚本
#   测试/       —— 2026-05 遗留目录，非当前测试套件
#   tests/      —— 测试自身，不计入被测代码
source = [
    "core", "采集层", "报警层", "存储层", "展示层",
    "用户层", "智能层", "gateway", "timeseries",
]
omit = [
    "*/tests/*",
    "*/测试/*",
    "legacy/*",
    "dist/*",
    "build/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["core", "采集层", "报警层", "存储层", "展示层", "智能层", "用户层"]
known_third_party = ["flask", "pymodbus", "asyncua", "paho", "jwt", "bcrypt", "pandas", "numpy", "yaml", "loguru"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportReturnType = "warning"
reportArgumentType = "warning"
reportUnknownMemberType = "none"
