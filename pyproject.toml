[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-scada"
version = "3.1.0"
description = "Industrial SCADA System - Modbus/OPC-UA/MQTT protocol gateway with real-time monitoring"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "pymodbus>=3.6.0",
    "asyncua>=1.0.0",
    "paho-mqtt>=1.6.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1",
]
tdengine = [
    "taos>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["配置*", "模板*", "静态资源*"]

[tool.pytest.ini_options]
# 真正的测试套件在 tests/（约 1880 个用例）。
# 历史配置指向 测试/，那里只有 13 个 2026-05 的遗留脚本，其中 4 个直接 ERROR、
# 其余用 `return True` 而非 assert（pytest 会警告 PytestReturnNotNone），
# 等于永远不会失败。结果就是裸跑 `pytest` 得到"13 个全绿"的假信号。
# 遗留目录待清理，先用 norecursedirs 排除，避免误收集。
testpaths = ["tests"]
norecursedirs = ["测试", "dist", "build", ".venv", "node_modules", "managed_components"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["core", "采集层", "报警层", "存储层", "展示层", "智能层", "用户层"]
known_third_party = ["flask", "pymodbus", "asyncua", "paho", "jwt", "bcrypt", "pandas", "numpy", "yaml", "loguru"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportReturnType = "warning"
reportArgumentType = "warning"
reportUnknownMemberType = "none"
