[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-scada"
# 版本号唯一真源：项目根目录的 VERSION 文件。不要在此硬编码版本。
# 构建时由 setuptools 动态读取，运行时由 core.version 读取，前后端 lockstep。
dynamic = ["version"]
description = "Industrial SCADA System - Modbus/OPC-UA/MQTT protocol gateway with real-time monitoring"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "pymodbus>=3.6.0",
    "asyncua>=1.0.0",
    "paho-mqtt>=1.6.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyright>=1.1",
]
tdengine = [
    "taos>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["配置*", "模板*", "静态资源*"]

[tool.setuptools.dynamic]
# 版本号从根目录 VERSION 文件读取（唯一真源）。
version = {file = "VERSION"}

[tool.pytest.ini_options]
# 真正的测试套件在 tests/（约 1880 个用例）。
# 历史配置指向 测试/，那里只有 13 个 2026-05 的遗留脚本，其中 4 个直接 ERROR、
# 其余用 `return True` 而非 assert（pytest 会警告 PytestReturnNotNone），
# 等于永远不会失败。结果就是裸跑 `pytest` 得到"13 个全绿"的假信号。
# 遗留目录待清理，先用 norecursedirs 排除，避免误收集。
testpaths = ["tests"]
norecursedirs = ["测试", "dist", "build", ".venv", "node_modules", "managed_components", ".pytest_tmp*", "dist-*", "build-*"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --- 零删除测试配置（不要改动，见下） ---------------------------------------
# WorkBuddy 环境注入了批量删除保护，pytest 默认的临时目录策略有两处会踩中：
#   1. 临时根放系统 TEMP（%LOCALAPPDATA%\Temp\pytest-of-<user>），
#      并在**每次运行开始时**滚动清理旧 run（默认保留最近 3 个），
#      一次删掉上万文件 → 必弹窗。
#   2. `-p cacheprovider` 写 .pytest_cache/v/cache/*，清理时同样走删除路径。
# 因此这里关掉 cacheprovider。
#
# ⚠️ basetemp **不能**写死成固定路径（如 .pytest_tmp）：
#    pytest 每次运行开始时会**清空 basetemp**，走 shim 的"移回收站"路径，
#    而 shim 对 `\\?\` 前缀路径报 `OSError [Errno 53] 找不到网络路径`
#    → `SAFE_DELETE_FAIL_CLOSED` 直接拒绝，整套测试在 setup 阶段全 ERROR。
#    （本机实测踩到，报错原文：
#     [safe-delete][SAFE_DELETE_FAIL_CLOSED] {"target": "...\\.pytest_tmp",
#      "reason": "trash-failed"}）
#
# 正解：把 basetemp 做成**每次运行都不同**的目录 —— 目录名带进程号，
# pytest 每次都遇到"全新的、不存在的" basetemp，因此**不需要清任何东西**。
# 具体路径在 tests/conftest.py 的 `pytest_configure` 里设置（可做插值）。
# 这里只保留：关 cacheprovider + 把 .pytest_tmp-* 排除出收集范围。
addopts = "-p no:cacheprovider"

[tool.coverage.run]
# 显式列出源码包。不写 `source = ["."]` 是因为仓库根下还有：
#   dist/       —— PyInstaller 产物，内含**整份重复源码**（约 248 MB），
#                  统计进去既极慢又严重失真
#   legacy/     —— 已归档的游离脚本
#   测试/       —— 2026-05 遗留目录，非当前测试套件
#   tests/      —— 测试自身，不计入被测代码
source = [
    "core", "采集层", "报警层", "存储层", "展示层",
    "用户层", "智能层", "gateway", "timeseries",
]
omit = [
    "*/tests/*",
    "*/测试/*",
    "legacy/*",
    "dist/*",
    "build/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["core", "采集层", "报警层", "存储层", "展示层", "智能层", "用户层"]
known_third_party = ["flask", "pymodbus", "asyncua", "paho", "jwt", "bcrypt", "pandas", "numpy", "yaml", "loguru"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportReturnType = "warning"
reportArgumentType = "warning"
reportUnknownMemberType = "none"
