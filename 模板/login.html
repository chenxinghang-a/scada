<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>登录 - 工业数据采集与监控系统</title>

    <!-- 深浅色：跟随系统偏好，驱动设计令牌(data-theme)与 Bootstrap/Tabler(data-bs-theme) -->
    <script>
        (function () {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function apply(dark) {
                var root = document.documentElement;
                root.setAttribute('data-theme', dark ? 'dark' : 'light');
                root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
            }
            apply(mq.matches);
            var onChange = function (e) { apply(e.matches); };
            if (mq.addEventListener) { mq.addEventListener('change', onChange); }
            else if (mq.addListener) { mq.addListener(onChange); }
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/design-tokens.css') }}" rel="stylesheet">

    <style>
        /* 登录页：门面页面。扁平纯色（不用渐变），颜色/间距/字号全部取设计令牌，
           输入框与按钮高度 ≥44px（可触达性），深色模式随 data-theme 自动生效。 */
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: var(--font-base);
            line-height: var(--leading-base);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-5);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        /* ---------- 品牌区：产品名 / 副标题 / 系统标识 ---------- */
        .login-brand {
            padding: var(--space-8) var(--space-6) var(--space-5);
            text-align: center;
            border-bottom: 1px solid var(--border-base);
        }

        .login-brand__icon {
            width: 56px;
            height: 56px;
            margin: 0 auto var(--space-4);
            border-radius: var(--radius-lg);
            background: var(--color-brand-soft);
            color: var(--color-brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-2xl);
        }

        .login-brand__name {
            margin: 0;
            font-size: var(--font-xl);
            font-weight: var(--weight-semibold);
            letter-spacing: 0.01em;
            color: var(--text-primary);
        }

        .login-brand__subtitle {
            margin: var(--space-2) 0 0;
            font-size: var(--font-sm);
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ---------- 表单区 ---------- */
        .login-body {
            padding: var(--space-6);
        }

        .login-field {
            margin-bottom: var(--space-4);
        }

        .login-field .form-label {
            font-size: var(--font-sm);
            font-weight: var(--weight-medium);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
        }

        .login-field .form-control {
            height: 48px;
            padding: 0 var(--space-4);
            font-size: var(--font-base);
            color: var(--text-primary);
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            transition: border-color var(--duration-fast) var(--ease-out),
                        box-shadow var(--duration-fast) var(--ease-out);
        }

        .login-field .form-control::placeholder {
            color: var(--text-disabled);
        }

        .login-field .form-control:focus {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--color-brand);
            box-shadow: var(--focus-ring);
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-5);
        }

        .login-options .form-check-label {
            font-size: var(--font-sm);
            color: var(--text-secondary);
            cursor: pointer;
        }

        .login-options .form-check-input {
            margin-top: 0.2em;
            border-color: var(--border-strong);
            cursor: pointer;
        }

        .login-options .form-check-input:checked {
            background-color: var(--color-brand);
            border-color: var(--color-brand);
        }

        /* ---------- 主按钮 ---------- */
        .btn-login {
            width: 100%;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            font-size: var(--font-lg);
            font-weight: var(--weight-semibold);
            letter-spacing: 0.08em;
            color: var(--text-inverse);
            background: var(--color-brand);
            border: 1px solid var(--color-brand);
            border-radius: var(--radius-md);
            transition: background var(--duration-fast) var(--ease-out),
                        border-color var(--duration-fast) var(--ease-out);
        }

        .btn-login:hover:not(:disabled) {
            background: var(--color-brand-strong);
            border-color: var(--color-brand-strong);
            color: var(--text-inverse);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ---------- 错误提示：底色 + 左边框色条 + 文字，不使用渐变 ---------- */
        .login-alert {
            display: flex;
            align-items: flex-start;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-5);
            background: var(--color-danger-soft);
            border: 1px solid var(--color-danger);
            border-left: 4px solid var(--color-danger);
            border-radius: var(--radius-md);
            color: var(--color-danger);
            font-size: var(--font-sm);
            font-weight: var(--weight-medium);
        }

        .login-alert i {
            font-size: var(--font-lg);
            line-height: var(--leading-tight);
        }

        /* ---------- 默认账户提示 ---------- */
        .default-accounts {
            margin-top: var(--space-5);
            padding: var(--space-3) var(--space-4);
            background: var(--bg-sunken);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-md);
            font-size: var(--font-xs);
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--duration-fast) var(--ease-out);
        }

        .default-accounts:hover {
            background: var(--bg-hover);
        }

        .default-accounts .title {
            display: flex;
            align-items: center;
            font-size: var(--font-xs);
            font-weight: var(--weight-semibold);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .default-accounts code {
            font-family: var(--font-mono);
            font-size: var(--font-xs);
            color: var(--text-primary);
            background: var(--bg-surface);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-sm);
            padding: 1px var(--space-1);
        }

        .default-accounts .hint {
            margin-top: var(--space-2);
            color: var(--text-muted);
        }

        /* ---------- 页脚 ---------- */
        .login-footer {
            padding: var(--space-4) var(--space-6);
            border-top: 1px solid var(--border-base);
            background: var(--bg-sunken);
            text-align: center;
            font-size: var(--font-xs);
            color: var(--text-muted);
        }

        /* ---------- 提交中状态 ---------- */
        .loading-spinner { display: none; }

        .loading .loading-spinner { display: inline-block; }

        .loading .btn-text { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- 品牌区 -->
            <div class="login-brand">
                <div class="login-brand__icon">
                    <i class="bi bi-gear-wide-connected"></i>
                </div>
                <h1 class="login-brand__name">工业数据采集与监控系统</h1>
                <p class="login-brand__subtitle">Industrial SCADA System</p>
            </div>

            <!-- 表单区 -->
            <div class="login-body">
                <div id="alertBox" class="login-alert d-none" role="alert" aria-live="assertive">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="alertMessage"></span>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="login-field">
                        <label class="form-label" for="username">用户名</label>
                        <input type="text" class="form-control" id="username"
                               placeholder="请输入用户名" required autocomplete="username">
                    </div>

                    <div class="login-field">
                        <label class="form-label" for="password">密码</label>
                        <input type="password" class="form-control" id="password"
                               placeholder="请输入密码" required autocomplete="current-password">
                    </div>

                    <div class="login-options">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">记住我</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span class="btn-text">
                            <i class="bi bi-box-arrow-in-right"></i> 登 录
                        </span>
                        <span class="loading-spinner spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <div class="default-accounts" onclick="fillDefault('admin','admin123')" title="点击自动填入">
                    <div class="title">
                        <i class="bi bi-info-circle me-1"></i>默认账户（点击填入）
                    </div>
                    <div>管理员: <code>admin</code> / <code>admin123</code></div>
                    <div class="hint">首次登录请修改默认密码</div>
                </div>
            </div>

            <div class="login-footer">
                <i class="bi bi-shield-check me-1"></i>
                基于JWT的安全认证 | v2.1
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 检查是否已登录
        const token = localStorage.getItem('auth_token');
        if (token) {
            // 验证token是否有效
            fetch('/api/auth/verify', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(r => r.json())
            .then(data => {
                if (data.valid) {
                    // 刷新cookie（cookie可能已过期，但localStorage的token还有效）
                    document.cookie = `token=${token}; path=/; SameSite=Lax`;
                    window.location.href = '/dashboard';
                } else {
                    // 服务端明确返回无效，才清token
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('scada_user');
                    document.cookie = 'token=; path=/; max-age=0';
                }
            })
            .catch(() => {
                // 网络错误/超时/服务器忙 → 不清token，保留登录状态
                // 下次访问页面会重新验证
            });
        }

        function showAlert(message) {
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            alertMessage.textContent = message;
            alertBox.classList.remove('d-none');

            // 3秒后自动隐藏
            setTimeout(() => {
                alertBox.classList.add('d-none');
            }, 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showAlert('请输入用户名和密码');
                return;
            }

            // 显示加载状态
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // 保存token和用户信息
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('scada_user', JSON.stringify(data.user));

                    if (rememberMe) {
                        localStorage.setItem('scada_refresh_token', data.refresh_token);
                    }

                    // 设置cookie供服务端页面认证使用
                    document.cookie = `token=${data.token}; path=/; SameSite=Lax`;

                    // 跳转到仪表盘
                    window.location.href = '/dashboard';
                } else {
                    showAlert(data.message || '登录失败');
                    document.getElementById('password').select();
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('网络错误，请检查服务器是否运行');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }

        // 回车键登录
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });

        // 点击默认账户自动填入
        function fillDefault(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
</body>
</html>
