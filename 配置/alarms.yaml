alarm_output:
  enabled: true
  relay_output:
    device_id: relay_output_01
    do_mapping:
      buzzer: 1
      red_light: 0
      solenoid_valve: 4
      spare: 5
      spare_buzzer: 3
      yellow_light: 2
    host: 192.168.1.72
    port: 502
    protocol: modbus_tcp
    slave_id: 1
  signal_tower:
    device_id: signal_tower_01
    do_mapping:
      blue_light: 3
      buzzer: 5
      buzzer_volume: 7
      flash_interval: 6
      green_light: 2
      red_light: 0
      white_light: 4
      yellow_light: 1
    host: 192.168.1.70
    port: 502
    protocol: modbus_tcp
    slave_id: 1
  station_output:
    device_id: relay_output_02
    do_mapping:
      corridor_light: 6
      master_buzzer: 7
      station_a_buzzer: 0
      station_a_green: 2
      station_a_red: 1
      station_b_buzzer: 3
      station_b_green: 5
      station_b_red: 4
    host: 192.168.1.73
    port: 502
    protocol: modbus_tcp
    slave_id: 2
alarm_rules:
- condition: greater_than
  delay: 10
  description: 锅炉出口温度超过上限
  device_id: siemens_1500_01
  enabled: true
  id: temp_high
  level: critical
  name: 锅炉温度过高
  register_name: boiler_temperature
  threshold: 180.0
  deadband: 2.0
  cause: 燃料给定量过大、给水/冷却水中断或换热面结垢导致出口温度持续上升
  consequence: 受热面超温蠕变、密封件失效，严重时触发联锁停炉并影响下游供汽
  action: 降低燃料给定并确认给水泵运行；检查冷却水阀开度与流量；5 分钟内无下降趋势按紧急停炉程序处理
  max_response_time_sec: 300
- condition: less_than
  delay: 10
  description: 锅炉出口温度低于下限
  device_id: siemens_1500_01
  enabled: true
  id: temp_low
  level: warning
  name: 锅炉温度过低
  register_name: boiler_temperature
  threshold: 50.0
  deadband: 2.0
  cause: 燃料中断/点火失败、负荷骤降或给水量过大
  consequence: 低温腐蚀、蒸汽带水导致下游设备冲击，产品不合格
  action: 检查燃烧器火焰与燃气压力、确认给料；必要时切手动维持负荷
  max_response_time_sec: 900
- condition: greater_than
  delay: 10
  description: 蒸馏塔顶温度超过上限
  device_id: hollysys_lk_01
  enabled: true
  id: env_temp_high
  level: warning
  name: 蒸馏塔温度过高
  register_name: distill_temperature
  threshold: 120.0
  deadband: 2.0
  cause: 再沸器蒸汽量过大或回流比失调，塔顶温度超出工艺窗口
  consequence: 塔顶产品不合格、塔压升高，后续工段负荷波动
  action: 减小再沸器蒸汽量、加大回流量，核对塔压与产品分析
  max_response_time_sec: 600
- condition: greater_than
  delay: 5
  description: 锅炉压力超过上限
  device_id: siemens_1500_01
  enabled: true
  id: pressure_high
  level: critical
  name: 锅炉压力过高
  register_name: boiler_pressure
  threshold: 1.2
  deadband: 0.02
  cause: 出口堵塞、安全阀未动作或温度过高导致汽化增压
  consequence: 设备超压、安全阀起跳、密封与法兰损伤，存在人员伤害风险
  action: 立即降负荷并确认安全阀/放空阀状态；人员远离设备正面；压力不降按紧急停车处理
  max_response_time_sec: 120
- condition: less_than
  delay: 5
  description: 锅炉压力低于下限
  device_id: siemens_1500_01
  enabled: true
  id: pressure_low
  level: warning
  name: 锅炉压力过低
  register_name: boiler_pressure
  threshold: 0.2
  deadband: 0.02
  cause: 管路泄漏、给水泵故障或下游负荷突增
  consequence: 泵汽蚀、供汽中断，下游工段停车
  action: 检查泵运行电流与出口阀位，排查管路泄漏点
  max_response_time_sec: 600
- condition: greater_than
  delay: 5
  description: A相电压超过上限
  device_id: abb_m4m_01
  enabled: true
  id: voltage_high
  level: critical
  name: A相电压过高
  register_name: voltage_a
  threshold: 242.0
  deadband: 2.0
  cause: 电网电压升高、无功补偿投切过量或轻载运行
  consequence: 绝缘加速老化、变频器过压跳闸，敏感设备损坏
  action: 核对进线电压与电容柜投切状态，必要时退出部分补偿组
  max_response_time_sec: 300
- condition: less_than
  delay: 5
  description: A相电压低于下限
  device_id: abb_m4m_01
  enabled: true
  id: voltage_low
  level: warning
  name: A相电压过低
  register_name: voltage_a
  threshold: 198.0
  deadband: 2.0
  cause: 电网跌落、大功率设备启动或线路压降过大
  consequence: 接触器抖动、电机堵转发热，控制系统复位
  action: 检查大功率设备启动状态与进线电压，确认 UPS 供电正常
  max_response_time_sec: 600
- condition: greater_than
  delay: 5
  description: A相电流超过上限
  device_id: abb_m4m_01
  enabled: true
  id: current_high
  level: critical
  name: A相电流过高
  register_name: current_a
  threshold: 100.0
  deadband: 2.0
  cause: 机械卡涩、负载过大或三相不平衡/缺相
  consequence: 绕组过热烧毁电机，产线停机
  action: 立即停机检查负载与相电流平衡，测量绝缘
  max_response_time_sec: 120
- condition: less_than
  delay: 15
  description: 出水pH值低于下限
  device_id: schneider_m340_01
  enabled: true
  id: ph_low
  level: warning
  name: 出水pH过低
  register_name: ph_value
  threshold: 6.5
  deadband: 0.1
  cause: 加酸过量或碱液供给中断
  consequence: 管路与设备腐蚀加速，工艺反应异常
  action: 核对加药泵流量与在线 pH 计校准状态，调整加药量
  max_response_time_sec: 900
- condition: greater_than
  delay: 15
  description: 出水pH值超过上限
  device_id: schneider_m340_01
  enabled: true
  id: ph_high
  level: warning
  name: 出水pH过高
  register_name: ph_value
  threshold: 8.5
  deadband: 0.1
  cause: 加碱过量或酸液供给中断
  consequence: 结垢堵塞、下游催化剂中毒
  action: 核对加药泵与酸液供给，必要时投用备用加药回路
  max_response_time_sec: 900
dedup:
  acknowledge_suppress_seconds: 600
  critical_toast_duration: 30
  emit_cooldown_seconds: 60
  enabled: true
  max_visible_toasts: 3
  warning_toast_duration: 10
notification:
  email:
    enabled: false
    password: ''
    recipients:
    - admin@example.com
    - engineer@example.com
    smtp_port: 587
    smtp_server: smtp.example.com
    username: ''
  # ⚠️ 短信通道**尚未实现**（round 250 如实标注）。
  # `报警层/notification.py:send_sms` 此前是「打一行 INFO 就 return True」的
  # 占位实现 —— 一条短信都不发，却报告成功。现已改为明确报错并返回 False，
  # 并接进了报警链路：**启用它会产生响亮的失败**（每条报警一条 ERROR 日志 +
  # `output_errors['sms']` 计数），而不是此前的静默无底洞。
  # 要实现它需要：阿里云 RPC 签名（HMAC-SHA1，百分号编码最容易错）、
  # 用 access_key/secret_key 调 SendSms、以及**无凭证环境下可测的签名单测**。
  # 清单见 send_sms 的 docstring。完成前请保持 enabled: false。
  sms:
    access_key: ''
    enabled: false
    phone_numbers:
    - '13800138000'
    provider: aliyun
    secret_key: ''
    sign_name: ''
    template_code: ''
  # ⚠️ 本段**没有任何服务端消费方**（round 250 核实）：后端不播放音频文件，
  # Vue 前端与旧版静态前端也都没有 `new Audio()` / `.mp3` 的播放代码。
  # 也就是说：把 enabled 改成 true、填好文件名，**不会发出任何声音**。
  # 真正的「声光」在 `报警层/alarm_output.py`（Modbus DO → 灯塔 + 蜂鸣器，
  # 硬件通道，那条是接通并可用的），语音广播在 `报警层/broadcast_system.py`
  # （MQTT → 现场音柱）。报警音效应在前端播放（WebSocket 收到 alarm 事件时），
  # 属 scada-app 的职责；本段留着只为兼容前端可能仍在发送的字段。
  sound:
    critical_sound: alarm_critical.mp3
    enabled: true
    warning_sound: alarm_warning.mp3

# ================================================================
# 告警升级策略（round 249 补）
# ================================================================
# 此前这个文件里**没有 escalation 段**，后果（round 249 实测）：
#   1. `AlarmEscalationManager` 从不装配 → `/api/alarms/escalation/*`
#      三个端点全部 500（守卫写的是 hasattr，而属性初值就是 None）；
#   2. 多级升级形同虚设，实际生效的只有代码里的单级 600 秒兜底。
#
# 下面这段的语义与补齐前的**单级 600 秒兜底完全一致**（一条 600 秒规则），
# 补齐只是把"隐式兜底"变成"显式配置"，行为不变、API 可用。
#
# ⚠️ 注意：通过 API 修改报警配置（加规则 / 改去重 / 改升级规则）会用
# `yaml.dump` 重写本文件，**yaml 注释不会保留** —— 本块说明会被抹平。
# 所以"sms 未实现""sound 没有消费方"等事实同时落在代码与测试里
# （tests/test_notification_channel_honesty.py），那才是耐久真源。
#
# 需要多级升级时按同样结构加规则即可（level 从 1 递增、不可重复；
# timeout_seconds 必须 >= 1；列表不能为空 —— 空列表会被拒）：
#
#   escalation:
#     timeout_seconds: 600          # 未给 rules 时合成单级规则用的超时
#     rules:
#       - level: 1
#         timeout_seconds: 600
#         actions: [notify, broadcast]
#         notify_roles: [operator]
#         message_template: '报警超时未确认: {alarm_message}'
#       - level: 2
#         timeout_seconds: 1800
#         actions: [notify, broadcast]
#         notify_roles: [engineer, operator]
#         message_template: '报警升级: {alarm_message} 已超时30分钟'
#
# 规则可通过 PUT /api/alarms/escalation/rules 热更新（写回本文件并重载，
# 重启后仍生效）。
escalation:
  timeout_seconds: 600
