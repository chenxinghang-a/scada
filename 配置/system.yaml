# =============================================================================
# 系统级配置（生产部署注意）
# - 本文件中的 ${VAR} 为环境变量占位符。core/config_manager.py 的 load_yaml
#   已支持 ${VAR} / ${VAR:-default} 展开；但仓库内仍有部分加载方直接使用
#   yaml.safe_load（不经 ConfigManager），这些路径不会展开占位符。
#   部署时必须通过环境变量注入真实值，且加载方需统一走 ConfigManager 或
#   自行做等价展开，否则请直接在部署侧渲染本文件（禁止把真实密钥提交进仓库）。
# - 所有变量清单见 .env.example。
# =============================================================================
# ⚠️ round 257：这里原有的 `alarm:` 段（check_interval / confirm_timeout /
#    escalation_time）**已删除** —— 三个键在生产代码里零读取点，全是装饰品，
#    而且每一条都已经有真正的实现，留着只会误导：
#      · 报警检查没有"轮询间隔"这回事：每次采集到样本就调 `check_alarm()`；
#      · "确认超时"是**规则级**的（`配置/alarms.yaml` 里每条规则的 `delay`）；
#      · "升级超时"的唯一真源是 `配置/alarms.yaml` 的 `escalation.rules`
#        （round 249 接的 AlarmEscalationManager，多级规则）。
#    守卫：tests/test_system_config_knobs.py::test_no_decorative_sections。
collection:
  # ⚠️ 2026-10-10（round 210）：这一段此前**整段是装饰品** —— 生产代码零读取点，
  #    而且 `max_concurrent` 与代码里的硬编码值**对不上**（这里 10 / 代码 20）。
  #    现在 `default_interval` 与 `max_concurrent` 已接到
  #    `core/config_manager.py::load_collection_settings()`，
  #    由 `采集层/data_collector.py` 真正使用。
  #    本段现在是**闭集**：新增键必须同时接上读取点，否则
  #    `tests/test_system_config_knobs.py` 会红。
  #
  # 采集间隔（秒）：**设备配置没写 `collection_interval` 时**用的兜底默认值。
  # 每台设备的实际间隔在 `配置/devices*.yaml` 的 `collection_interval` 里，
  # 那个优先级更高（本项只是缺省）。
  default_interval: 5
  # 采集线程池上限（并发采集连接数）。
  # ⚠️ 值从 10 改成 20 是**对齐现状**：代码里此前硬编码 `max_workers=20`，
  #    而这里写 10 —— 两边对不上（配置那侧零读取点，所以一直没人发现）。
  #    现在这个值**真的生效**了：要调并发就改这里。
  max_concurrent: 20
  # 已删除的键（它们描述的策略在代码里并不存在，round 210）：
  #   retry.interval_seconds / retry.max_attempts
  #     —— 实际退避是**指数退避** `min(2 ** failures, BACKOFF_CEILING_S=60)`，
  #        不是「每 5 秒重试、最多 3 次」。
  #   timeout
  #     —— 实际超时在**设备/客户端**配置里（如 `采集层/fins_client.py` 读
  #        `config.get('timeout', 10)`），不是系统级旋钮。
database:
  compression:
    enabled: true
    interval_hours: 24
    method: average
  path: data/scada.db
  retention:
    # 数据保留策略的**唯一真源**（core/retention_scheduler.py 每 6 小时按它执行一次）。
    #
    # ⚠️ 2026-10-10（round 209）之前，这三个窗口**没有任何代码读、也没有任何调度器**
    #    调用过 `enforce_retention_policy` —— 实测 679 MB 的 scada_simulated.db 里
    #    **105,028 条报警全部是 5 月的（约 150 天前）**，配置说只留 90 天却一行没删；
    #    按当时增速约 34 MB/天 ≈ 12 GB/年，而系统里有 disk 健康检查。
    #
    # `enabled` 是**显式开关**，且默认为假：删数据不可逆，所以
    # 「配置段读不到 / 没写 enabled / enabled 不为真」时**什么都不删**（fail-safe）。
    # 不要用 core/ops_tools.py 的 RuntimeConfigManager.data_retention_days 来配这个 ——
    # 那是单数字旋钮，表达不了按表分粒度，而且会变成第二个真源。
    enabled: true
    alarm_days: 90
    compressed_data_days: 365
    raw_data_days: 30
  type: sqlite
# ⚠️ round 257：原有 `export:` 段（directory / formats / max_rows）**已删除** ——
#    零读取点，导出实现根本不看它：
#      · 导出目录的唯一真源是 `paths.EXPORT_DIR`（支持 SCADA_EXPORT_DIR 覆盖）；
#      · 可用格式由 `存储层/data_export.py` 自己校验，传错格式回 400；
#      · 单次导出行数上限由导出器按查询粒度判断（超限回 400 并说明怎么改）。
#    把这三项写在配置文件里，只会让人以为"改这里能生效"。
logging:
  # ⚠️ round 266：这一段此前是**装饰品** —— 值写在这里，实际生效的是
  #    `config.LogConfig`（轮转 100 MB、保留 30 天、级别 INFO），改这里没反应。
  #    现在由 `core.config_manager.load_logging_settings()` 真正读取，
  #    优先级：**环境变量 > 本文件 > 兜底默认值**。
  console:
    # 是否输出到 stderr（容器/服务方式部署时通常关掉，只留文件）
    enabled: true
  file:
    # 保留几个历史文件（loguru retention，按"个"计，不是按天）
    backup_count: 5
    enabled: true
    # 单个文件多大开始轮转（MB）。⚠️ 改这里会真的生效（round 266 之前不会）
    max_size_mb: 10
    # 只取**目录**部分；文件名由结构化日志模块按日期生成
    # （`scada_2026-10-25.log`），这样"按天分文件 + 按大小轮转"可以并存
    path: logs/scada.log
  # ⚠️ `format` 段已删除（round 266）：这里写的是 Python logging 的
  #    `%(asctime)s...` 语法，而本项目用 loguru，格式串由
  #    `core/structured_logging.py` 决定，这一段从来没有被读过。
  # 级别：TRACE/DEBUG/INFO/SUCCESS/WARNING/ERROR/CRITICAL
  # ⚠️ 不要在生产开 DEBUG：每秒钟的采集/推送日志会把磁盘写满（约 10x~50x 量增）
  level: INFO
performance:
  # ⚠️ round 257：原有 `cache:` 子段（enabled / type / ttl_seconds）**已删除** ——
  #    缓存模块在 round 247 就整块删掉了（`core/api_cache.py` / `cache_tier.py`
  #    已不存在），留着这一段等于承诺一个不存在的功能。
  #
  # 连接池：**这一段是真旋钮**（round 257 接线）。
  # 此前 `采集层/device_manager.py` 里是 `max_size=50 / max_idle_time=300 /
  # max_lifetime=3600` 的硬编码，而这里写的是 `size: 10 / timeout: 30` ——
  # 两边都对不上，运维按 10 调小连接数完全没有效果。
  # 现在由 `core/config_manager.load_connection_pool_settings()` 读取，
  # 读不到/非法时回退 `CONNECTION_POOL_DEFAULTS`（= 下面这三个值）。
  # 守卫：tests/test_system_config_knobs.py
  connection_pool:
    # 连接池容量上限（同时保持的客户端连接数）。
    size: 50
    # 空闲多久回收（秒）。原键名 `timeout` 语义不明（是建连超时还是空闲回收？），
    # 改为显式命名；`timeout` 已删除。
    idle_timeout_seconds: 300
    # 连接最大存活时间（秒），到期强制重建，规避长连接泄漏。
    max_lifetime_seconds: 3600
# round 256：`simulation_mode` 现在是**启动时真的会读**的字段。
# 优先级：命令行 `--simulator` / `--real` > 本字段 > 默认模拟。
#   · true  → 模拟模式（开箱默认，不连现场设备）
#   · false → 真实设备模式；但仅当 devices_real.yaml 的 devices 非空才生效，
#             否则启动时打 ERROR 并退回模拟（避免"点了真实模式，服务却起不来"）
# 界面上切换模拟/真实模式会写这个字段，重启后保持上次选择。
system:
  author: 陈星行
  description: 基于Python的工业数据采集与监控系统（四层漏斗架构）
  name: 工业数据采集与监控系统
  simulation_mode: true
  version: 2.1.0
# ⚠️ round 257：原有 `mqtt:` 段（broker_host / broker_port / tls.*）**已删除** ——
#    零读取点。MQTT 连接的默认值来自 `config.MQTTConfig`，它只读**环境变量**：
#      MQTT_BROKER / MQTT_PORT / MQTT_TLS_ENABLED / MQTT_CA_CERT /
#      MQTT_CLIENT_CERT / MQTT_CLIENT_KEY / MQTT_TLS_INSECURE
#    （清单见 .env.example）。设备级 MQTT 参数在 `配置/devices*.yaml` 的
#    `host` / `port` / `tls_*` 里；广播音柱的 MQTT 在 `配置/alarms.yaml` 的
#    `broadcast.mqtt` 里（那是**另一个** MQTT 连接，别混）。
#    把同一个旋钮写在三处、而其中一处没人读，是最容易让运维白折腾的形状。
web:
  cors:
    enabled: true
    # CORS 白名单：仅允许系统自身前端源。生产部署如需暴露给其他源，
    # 请按实际域名收敛此列表，禁止使用 '*' 通配。
    #
    # ⚠️⚠️ 收敛白名单时 **`file://` 必须保留** —— 删掉它会让桌面版实时通道**静默失效**。
    #    桌面版（Electron）页面是**用 file:// 加载**的，它的 Origin 就是字符串 `file://`。
    #    少了它，engine.io 会直接回 `file:// is not an accepted origin.`
    #    → **整条实时通道全废**（性能监控/数据大屏/报警输出都走 socket.io）。
    #    危险之处在于**它是静默的**：HTTP 接口照常、页面照常打开，只有实时数据不再更新。
    #    2026-10-10 事故的形状正是如此 —— 后来人做「安全收敛」时按「只留 http(s) 源」清一遍，
    #    桌面版就再也没有实时通道了。**本行不许删。**
    #    2026-10-10 实测（wb 在隔离副本上）：修复前 `curl -H 'Origin: file://' …` 被拒，
    #    修复后 200 + `Access-Control-Allow-Origin: file://`；
    #    数据大屏从 0/0 变成 30/30 在线、采集吞吐 2615 条/分。
    #    守卫：`tests/test_websocket_cors_origins.py`。
    origins:
    - 'file://'
    - 'http://localhost:5000'
    - 'http://127.0.0.1:5000'
  # 调试模式：生产环境必须为 false（开启会暴露堆栈/交互式调试器）
  debug: false
  host: 127.0.0.1
  port: 5000
  # ⚠️ 这里**没有** web.secret_key —— 别再往这里加。
  # Web 会话密钥的**唯一真源**是环境变量 `SECRET_KEY`
  # （`config.FlaskConfig.SECRET_KEY`，见 config.py；部署清单见 .env.example）。
  #
  # 本文件原先有一行 `secret_key: ${SCADA_SECRET_KEY}`。实测（round 207）：
  #   * `SCADA_SECRET_KEY` 在整仓只出现在那两行 —— 没有任何声明源会设置它；
  #   * `web.secret_key` 没有任何代码读它（唯一提及是 api_system.py 的**脱敏名单**，
  #     给一个没人读的键做脱敏，是这条死接线最讽刺的注脚）；
  #   * `.env.example` 的 `SECRET_KEY` 旁还写着「同时供 web.secret_key 引用」——
  #     两处散文互相矛盾，且都与代码不符；
  #   * 且 `expand_env_vars` 对「未设置且无默认值」的占位符是**保留原文 + 告警**，
  #     这行会让每次加载配置都打一条永远消除不掉的 warning。
  # 已删除。守卫见 tests/test_env_vars_wired.py 的「引用了但无处声明」那组。
