# =============================================================================
# 系统级配置（生产部署注意）
# - 本文件中的 ${VAR} 为环境变量占位符。core/config_manager.py 的 load_yaml
#   已支持 ${VAR} / ${VAR:-default} 展开；但仓库内仍有部分加载方直接使用
#   yaml.safe_load（不经 ConfigManager），这些路径不会展开占位符。
#   部署时必须通过环境变量注入真实值，且加载方需统一走 ConfigManager 或
#   自行做等价展开，否则请直接在部署侧渲染本文件（禁止把真实密钥提交进仓库）。
# - 所有变量清单见 .env.example。
# =============================================================================
alarm:
  check_interval: 10
  confirm_timeout: 300
  escalation_time: 600
collection:
  default_interval: 5
  max_concurrent: 10
  retry:
    interval_seconds: 5
    max_attempts: 3
  timeout: 10
database:
  compression:
    enabled: true
    interval_hours: 24
    method: average
  path: data/scada.db
  retention:
    alarm_days: 90
    compressed_data_days: 365
    raw_data_days: 30
  type: sqlite
export:
  directory: exports
  formats:
  - csv
  - excel
  - json
  max_rows: 100000
logging:
  console:
    enabled: true
  file:
    backup_count: 5
    enabled: true
    max_size_mb: 10
    path: logs/scada.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: DEBUG
performance:
  cache:
    enabled: true
    ttl_seconds: 300
    type: memory
  connection_pool:
    size: 10
    timeout: 30
system:
  author: 陈星行
  description: 基于Python的工业数据采集与监控系统（四层漏斗架构）
  name: 工业数据采集与监控系统
  simulation_mode: false
  version: 2.1.0
mqtt:
  broker_host: localhost
  broker_port: 1883
  tls:
    enabled: false
    ca_cert: ""
    client_cert: ""
    client_key: ""
    insecure: false
  # TLS端口通常8883
  # tls_port: 8883
web:
  cors:
    enabled: true
    # CORS 白名单：仅允许系统自身前端源。生产部署如需暴露给其他源，
    # 请按实际域名收敛此列表，禁止使用 '*' 通配。
    origins:
    - 'http://localhost:5000'
    - 'http://127.0.0.1:5000'
  # 调试模式：生产环境必须为 false（开启会暴露堆栈/交互式调试器）
  debug: false
  host: 127.0.0.1
  port: 5000
  # Web 会话密钥：禁止明文写入仓库，由环境变量 SCADA_SECRET_KEY 注入
  secret_key: ${SCADA_SECRET_KEY}
