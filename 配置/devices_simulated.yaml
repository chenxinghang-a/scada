devices:
- collection_interval: 10
  description: 旋转设备振动监测 — 电机/泵/风机
  device_model: IoT-VIB-100 + LoRa GW
  enabled: true
  host: 192.168.1.200
  id: vibration_sensor_01
  line: vibration_monitor
  name: MQTT振动监测节点
  password: ${MQTT_SCADA_PASSWORD}
  port: 1883
  protocol: mqtt
  role: instrument
  sim_endpoint:
    host: 127.0.0.1
    port: 18830
  site: east_plant
  stage: 监测
  topics:
  - description: X轴振动速度
    json_path: value
    name: vibration_x
    topic: factory/motor_group/vibration/x_axis
    unit: mm/s
  - description: Y轴振动速度
    json_path: value
    name: vibration_y
    topic: factory/motor_group/vibration/y_axis
    unit: mm/s
  - description: Z轴振动速度
    json_path: value
    name: vibration_z
    topic: factory/motor_group/vibration/z_axis
    unit: mm/s
  - description: 轴承温度
    json_path: value
    name: bearing_temperature
    topic: factory/motor_group/vibration/temperature
    unit: °C
  username: ${MQTT_SCADA_USER:-scada}
  vendor: 自研物联网节点
  workshop: utility
  zone: 公用工程
- auth_password: ${DEVICE_REST_ADMIN_PASSWORD}
  auth_type: basic
  auth_username: admin
  base_url: http://192.168.1.52
  collection_interval: 5
  description: S7-1500内置REST接口 — 备用数据通道
  device_model: S7-1516-3 PN/DP
  enabled: true
  endpoints:
  - json_path: value
    method: GET
    name: ambient_temperature
    path: /api/v1/variables/DB1.temperature
    unit: °C
  - json_path: value
    method: GET
    name: system_pressure
    path: /api/v1/variables/DB1.pressure
    unit: MPa
  - json_path: value
    method: GET
    name: production_count
    path: /api/v1/variables/DB100.product_count
    unit: 个
  - json_path: value
    method: GET
    name: line_status
    path: /api/v1/variables/DB100.line_status
    unit: ''
  id: siemens_web_01
  line: integration
  name: 西门子S7-1500 Web API
  poll_interval: 5
  protocol: rest
  role: controller
  sim_endpoint:
    host: 127.0.0.1
    port: 15500
  site: east_plant
  stage: 采集
  vendor: 西门子
  workshop: it
  zone: 信息中心
- auth_token: ${MES_API_TOKEN}
  auth_type: bearer
  base_url: http://192.168.1.250:8080
  collection_interval: 30
  description: MES生产数据接口 — 计划/质量/OEE
  device_model: MES Enterprise v3.2
  enabled: true
  endpoints:
  - json_path: data.oee
    method: GET
    name: oee
    path: /api/v1/production/oee
    unit: '%'
  - json_path: data.rate
    method: GET
    name: quality_rate
    path: /api/v1/quality/rate
    unit: '%'
  - json_path: data.quantity
    method: GET
    name: planned_quantity
    path: /api/v1/production/plan/quantity
    unit: 个
  - json_path: data.quantity
    method: GET
    name: actual_quantity
    path: /api/v1/production/actual/quantity
    unit: 个
  - json_path: data.rate
    method: GET
    name: defect_rate
    path: /api/v1/quality/defect_rate
    unit: '%'
  id: mes_api_01
  line: integration
  name: MES制造执行系统
  poll_interval: 30
  protocol: rest
  role: controller
  sim_endpoint:
    host: 127.0.0.1
    port: 15501
  site: east_plant
  stage: 平台
  vendor: 自研MES系统
  workshop: it
  zone: 信息中心
- collection_interval: 1
  description: 产线1号设备状态指示灯塔 — 红黄绿蓝白+蜂鸣器
  device_model: LR7-302NWFB
  enabled: true
  host: 192.168.1.70
  id: signal_tower_01
  line: assembly_a
  name: Patlite LR7信号灯塔 — 1号线
  port: 502
  protocol: modbus_tcp
  registers:
  - address: 0
    data_type: uint16
    description: 红色灯
    length: 1
    name: red_light
    scale: 1
    unit: ''
  - address: 1
    data_type: uint16
    description: 黄色灯
    length: 1
    name: yellow_light
    scale: 1
    unit: ''
  - address: 2
    data_type: uint16
    description: 绿色灯
    length: 1
    name: green_light
    scale: 1
    unit: ''
  - address: 3
    data_type: uint16
    description: 蓝色灯
    length: 1
    name: blue_light
    scale: 1
    unit: ''
  - address: 4
    data_type: uint16
    description: 白色灯
    length: 1
    name: white_light
    scale: 1
    unit: ''
  - address: 5
    data_type: uint16
    description: 蜂鸣器
    length: 1
    name: buzzer
    scale: 1
    unit: ''
  role: equipment
  sim_endpoint:
    host: 127.0.0.1
    port: 15020
  site: east_plant
  slave_id: 1
  stage: 打标
  vendor: Patlite (日本帕特莱)
  workshop: assembly
  zone: 装配车间
- collection_interval: 1
  description: 报警输出控制 — 外部警灯/蜂鸣器/电磁阀
  device_model: ADAM-6060-AE
  enabled: true
  host: 192.168.1.72
  id: relay_output_01
  line: backup
  name: 研华ADAM-6060继电器模块
  port: 502
  protocol: modbus_tcp
  registers:
  - access: rw
    address: 0
    data_type: uint16
    description: 继电器1
    length: 1
    name: relay_1
    scale: 1
    unit: ''
  - access: rw
    address: 1
    data_type: uint16
    description: 继电器2
    length: 1
    name: relay_2
    scale: 1
    unit: ''
  - access: rw
    address: 2
    data_type: uint16
    description: 继电器3
    length: 1
    name: relay_3
    scale: 1
    unit: ''
  - access: rw
    address: 3
    data_type: uint16
    description: 继电器4
    length: 1
    name: relay_4
    scale: 1
    unit: ''
  - access: rw
    address: 4
    data_type: uint16
    description: 继电器5
    length: 1
    name: relay_5
    scale: 1
    unit: ''
  - access: rw
    address: 5
    data_type: uint16
    description: 继电器6
    length: 1
    name: relay_6
    scale: 1
    unit: ''
  role: equipment
  sim_endpoint:
    host: 127.0.0.1
    port: 15021
  site: east_plant
  slave_id: 1
  stage: 控制
  vendor: 研华科技 (Advantech)
  workshop: electrical
  write_limits:
    relay_1:
    - 0
    - 1
    relay_2:
    - 0
    - 1
    relay_3:
    - 0
    - 1
    relay_4:
    - 0
    - 1
    relay_5:
    - 0
    - 1
    relay_6:
    - 0
    - 1
  zone: 配电房
- collection_interval: 3
  description: 支持OPC UA的PLC控制器
  enabled: true
  endpoint: opc.tcp://192.168.1.50:4840
  id: opcua_plc_01
  line: integration
  name: OPC UA PLC控制器
  nodes:
  - description: 温度值
    name: temperature
    node_id: ns=3;s=Temperature
    unit: °C
  - description: 压力值
    name: pressure
    node_id: ns=3;s=Pressure
    unit: MPa
  - description: 电机转速
    name: motor_speed
    node_id: ns=3;s=MotorSpeed
    unit: RPM
  - description: 运行状态
    name: running_status
    node_id: ns=3;s=RunningStatus
    unit: ''
  protocol: opcua
  role: controller
  security_mode: None
  sim_endpoint:
    host: 127.0.0.1
    port: 15400
  site: east_plant
  stage: 采集
  workshop: it
  zone: 信息中心
- collection_interval: 3
  description: 化工车间控制 — 蒸馏/干燥/包装
  device_model: LK210
  enabled: true
  host: 192.168.1.55
  id: hollysys_lk_01
  line: reaction_a
  name: 和利时LK PLC
  port: 502
  protocol: modbus_tcp
  registers:
  - address: 0
    data_type: float32
    description: 蒸馏塔顶温度
    length: 2
    name: distill_temperature
    scale: 1.0
    unit: °C
  - address: 2
    data_type: float32
    description: 蒸馏塔压力
    length: 2
    name: distill_pressure
    scale: 1.0
    unit: kPa
  - address: 4
    data_type: float32
    description: 干燥机温度
    length: 2
    name: dryer_temperature
    scale: 1.0
    unit: °C
  - address: 6
    data_type: float32
    description: 干燥机湿度
    length: 2
    name: dryer_humidity
    scale: 1.0
    unit: '%'
  - address: 8
    data_type: float32
    description: 回流比
    length: 2
    name: reflux_ratio
    scale: 1.0
    unit: ''
  role: controller
  sim_endpoint:
    host: 127.0.0.1
    port: 15022
  site: east_plant
  slave_id: 1
  stage: 反应
  vendor: 和利时
  workshop: chemical
  zone: 化工车间
- _simulation_params:
    base_values:
      boiler_pressure: 1.2
      boiler_temperature: 180
      feed_water_level: 500
      flue_gas_temperature: 160
      oxygen_content: 8
      steam_flow: 5.0
    energy_baseline: 200
    noise_levels:
      boiler_pressure: 0.05
      boiler_temperature: 3
      feed_water_level: 10
      flue_gas_temperature: 5
      oxygen_content: 0.5
      steam_flow: 0.3
    theoretical_rate: 120
  collection_interval: 2
  description: 主产线控制PLC — 锅炉/换热器/反应釜群
  device_model: S7-1516-3 PN/DP
  enabled: true
  host: 192.168.1.53
  id: siemens_1500_01
  line: injection_a
  name: 西门子S7-1500 PLC
  port: 502
  protocol: modbus_tcp
  registers:
  - address: 0
    data_type: float32
    description: 锅炉出口温度
    length: 2
    name: boiler_temperature
    scale: 1.0
    unit: °C
  - address: 2
    data_type: float32
    description: 锅炉压力
    length: 2
    name: boiler_pressure
    scale: 1.0
    unit: MPa
  - address: 4
    data_type: float32
    description: 换热器出口温度
    length: 2
    name: heat_exchanger_temperature
    scale: 1.0
    unit: °C
  - address: 6
    data_type: float32
    description: 蒸汽流量
    length: 2
    name: steam_flow
    scale: 1.0
    unit: t/h
  - address: 8
    data_type: float32
    description: 给水液位
    length: 2
    name: feed_water_level
    scale: 1.0
    unit: mm
  - address: 10
    data_type: float32
    description: 排烟温度
    length: 2
    name: flue_gas_temperature
    scale: 1.0
    unit: °C
  - address: 12
    data_type: float32
    description: 烟气含氧量
    length: 2
    name: oxygen_content
    scale: 1.0
    unit: '%'
  - address: 14
    data_type: uint16
    description: 锅炉状态 0=停炉/1=运行/2=故障
    length: 1
    name: boiler_status
    scale: 1
    unit: ''
  role: controller
  sim_endpoint:
    host: 127.0.0.1
    port: 15023
  site: east_plant
  slave_id: 1
  stage: 注塑
  vendor: 西门子
  workshop: injection
  zone: 注塑车间
- collection_interval: 2
  description: 注塑车间控制 — 注塑机/模具/脱模
  device_model: FX5U-64M
  enabled: true
  host: 192.168.1.56
  id: mitsubishi_fx5u_01
  line: injection_b
  name: 三菱FX5U PLC
  port: 502
  protocol: modbus_tcp
  registers:
  - address: 0
    data_type: float32
    description: 模具温度
    length: 2
    name: mold_temperature
    scale: 1.0
    unit: °C
  - address: 2
    data_type: float32
    description: 注射压力
    length: 2
    name: injection_pressure
    scale: 1.0
    unit: MPa
  - address: 4
    data_type: float32
    description: 注射速度
    length: 2
    name: injection_speed
    scale: 1.0
    unit: mm/s
  - address: 6
    data_type: float32
    description: 保压位置
    length: 2
    name: cushion_position
    scale: 1.0
    unit: mm
  - address: 8
    data_type: float32
    description: 成型周期
    length: 2
    name: cycle_time
    scale: 1.0
    unit: s
  - address: 10
    data_type: uint16
    description: 注射计数
    length: 1
    name: shot_count
    scale: 1
    unit: 个
  - address: 11
    data_type: float32
    description: 锁模力
    length: 2
    name: clamping_force
    scale: 1.0
    unit: kN
  - address: 13
    data_type: float32
    description: 料筒温度
    length: 2
    name: barrel_temperature
    scale: 1.0
    unit: °C
  role: controller
  sim_endpoint:
    host: 127.0.0.1
    port: 15024
  site: east_plant
  slave_id: 1
  stage: 注塑
  vendor: 三菱电机
  workshop: injection
  zone: 注塑车间
- collection_interval: 5
  description: 包装线控制 — 封箱/贴标/码垛
  device_model: DVP32EH00T3
  enabled: true
  host: 192.168.1.57
  id: delta_dvp_01
  line: pack_b
  name: 台达DVP PLC
  port: 502
  protocol: modbus_tcp
  registers:
  - address: 0
    data_type: uint16
    description: 输送带速度
    length: 1
    name: conveyor_speed
    scale: 0.1
    unit: m/min
  - address: 1
    data_type: uint16
    description: 封箱温度
    length: 1
    name: sealing_temperature
    scale: 0.1
    unit: °C
  - address: 2
    data_type: uint16
    description: 贴标计数
    length: 1
    name: label_count
    scale: 1
    unit: 个
  - address: 3
    data_type: uint16
    description: 码垛计数
    length: 1
    name: palletizing_count
    scale: 1
    unit: 个
  - address: 4
    data_type: uint16
    description: 剔除计数
    length: 1
    name: reject_count
    scale: 1
    unit: 个
  - address: 5
    data_type: uint16
    description: 包装线状态 0=停机/1=运行/2=换料/3=故障
    length: 1
    name: packing_status
    scale: 1
    unit: ''
  role: controller
  sim_endpoint:
    host: 127.0.0.1
    port: 15025
  site: east_plant
  slave_id: 1
  stage: 装箱
  vendor: 台达电子
  workshop: packaging
  zone: 包装车间
- collection_interval: 5
  description: 暖通空调空气处理机组 — 送风/回风/冷冻水
  device_model: PXC36
  enabled: true
  host: 192.168.1.110
